name: Ingesta

on:
  schedule:
    # Cada 6 horas: la señal de jugadores concurrentes.
    - cron: "5 */6 * * *"
    # Una vez al dia: catalogo, reseñas y metadata de IGDB.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Fuente a ingestar manualmente"
        required: true
        default: player_counts
        type: choice
        options: [player_counts, app_list, reviews, igdb_games]

concurrency:
  # Nunca dos corridas simultaneas: evita duplicados y rate limits.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
      DATABRICKS_BRONZE_JOB_ID: ${{ vars.DATABRICKS_BRONZE_JOB_ID }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      INGEST_USER_AGENT: ${{ vars.INGEST_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ---- 1. EXTRACCION ----

      - name: Ingesta cada 6 horas (jugadores)
        if: github.event.schedule == '5 */6 * * *'
        run: python -m ingestion.run_ingest player_counts

      - name: Ingesta diaria (catalogo, reseñas, igdb)
        if: github.event.schedule == '20 3 * * *'
        run: |
          python -m ingestion.run_ingest app_list
          python -m ingestion.run_ingest reviews
          python -m ingestion.run_ingest igdb_games

      - name: Ingesta manual
        if: github.event_name == 'workflow_dispatch'
        run: python -m ingestion.run_ingest ${{ inputs.source }}

      # ---- 2. BRONZE (Job de Databricks via API) ----

      - name: Procesar Bronze en Databricks
        run: python -m ingestion.trigger_bronze

      # ---- 3. SILVER + GOLD (dbt) ----

      - name: Preparar profiles de dbt
        run: cp dbt/profiles.yml.example dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt deps

      - name: dbt build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt build --target dev